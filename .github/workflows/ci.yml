name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Test
        run: python -m pytest

      - name: Check public repository contents
        run: python scripts/check_public_repo.py .

      - name: Check CLI
        run: historical-table --help

      - name: Run offline synthetic demo
        run: historical-table demo --output "$RUNNER_TEMP/demo"

      - name: Validate Agent Skill metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          skill_dir = Path("skills/digitize-historical-tables")
          text = (skill_dir / "SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---\n"), "SKILL.md must start with YAML frontmatter"
          _, frontmatter, body = text.split("---", 2)
          metadata = yaml.safe_load(frontmatter)
          assert set(metadata) == {"name", "description"}
          assert metadata["name"] == skill_dir.name
          assert metadata["description"].strip()
          assert "TODO" not in text
          assert body.strip()

          ui = yaml.safe_load(
              (skill_dir / "agents/openai.yaml").read_text(encoding="utf-8")
          )
          assert "$digitize-historical-tables" in ui["interface"]["default_prompt"]
          PY

      - name: Build distribution
        if: matrix.python-version == '3.11'
        run: python -m build
