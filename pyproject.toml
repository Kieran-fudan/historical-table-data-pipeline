[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "historical-table-data-pipeline"
version = "0.1.0"
description = "Auditable multi-source OCR reconciliation for historical tabular data"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kieran-fudan" }]
keywords = [
  "ocr",
  "historical-data",
  "table-extraction",
  "data-quality",
  "research-data",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
pdf = [
  "Pillow>=10.4",
  "pypdfium2>=4.30",
]
ocr = [
  "openai>=1.54",
]
research = [
  "duckdb>=1.1",
]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]
all = [
  "Pillow>=10.4",
  "pypdfium2>=4.30",
  "openai>=1.54",
  "duckdb>=1.1",
]

[project.scripts]
historical-table = "historical_table_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/Kieran-fudan/historical-table-data-pipeline"
Repository = "https://github.com/Kieran-fudan/historical-table-data-pipeline"
Issues = "https://github.com/Kieran-fudan/historical-table-data-pipeline/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/historical_table_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"examples/synthetic" = "historical_table_pipeline/data/examples/synthetic"
"profiles/example-records.yaml" = "historical_table_pipeline/data/profiles/example-records.yaml"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["historical_table_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
